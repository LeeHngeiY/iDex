name: Build iDex IPA

# 放到 fork 出来的仓库里：<repo>/.github/workflows/build-ipa.yml
# 然后在 Actions 页面手动触发（Run workflow），产物在同一次 run 的 Artifacts 里下载。

on:
  workflow_dispatch:
    inputs:
      team_id:
        description: '可选：Apple 开发者 Team ID（留空则产出未签名 IPA）'
        required: false
        default: ''

jobs:
  build-ipa:
    # iDex 需要 iOS 27 SDK / Xcode 27.1。
    # macos-latest 会挑当前最新的官方镜像，避免写死 macos-26 时出现 "no runner matching labels"。
    # 若日志里 SDK 仍低于 27，说明官方镜像还没跟上：改用自建 runner（runs-on: self-hosted）
    # 或在 Codemagic / Bitrise 上选 Xcode 27 的机器跑同样的命令。
    runs-on: macos-latest
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: 选择最新 Xcode 并校验 SDK
        run: |
          XCODE_APP="$(ls -d /Applications/Xcode*.app | sort -V | tail -1)"
          echo "使用 $XCODE_APP"
          sudo xcode-select -s "$XCODE_APP/Contents/Developer"
          xcodebuild -version
          SDK="$(xcrun --sdk iphoneos --show-sdk-version)"
          echo "iOS SDK: $SDK"
          case "$SDK" in
            2[7-9]*|3*) echo "SDK 满足要求（>= 27）" ;;
            *) echo "::error::当前 runner 的 iOS SDK 为 $SDK，低于工程要求的 27.0，请换用带 Xcode 27 的 runner"; exit 1 ;;
          esac

      - name: 注入共享 scheme
        run: |
          mkdir -p iDex.xcodeproj/xcshareddata/xcschemes
          cp ci/iDex.xcscheme iDex.xcodeproj/xcshareddata/xcschemes/iDex.xcscheme

      - name: Archive（未签名）
        run: |
          xcodebuild archive \
            -project iDex.xcodeproj \
            -scheme iDex \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/iDex.xcarchive" \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            DEVELOPMENT_TEAM="" \
            ONLY_ACTIVE_ARCH=NO

      - name: 打包 IPA
        run: |
          APP="$RUNNER_TEMP/iDex.xcarchive/Products/Applications/iDex.app"
          test -d "$APP"
          mkdir -p "$RUNNER_TEMP/Payload"
          cp -R "$APP" "$RUNNER_TEMP/Payload/"
          cd "$RUNNER_TEMP"
          zip -qry iDex-unsigned.ipa Payload
          ls -lh iDex-unsigned.ipa

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: iDex-unsigned-ipa
          path: ${{ runner.temp }}/iDex-unsigned.ipa
          if-no-files-found: error
          retention-days: 7
